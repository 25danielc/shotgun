<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Shotgun · mission control</title>
<!--
  Shotgun mission control: the judging-table view of a drive. Read-only: it polls
  GET /dashboard/state (docs/dashboard_state.schema.md) and never approves anything.
  Design rules: .claude/skills/shotgun-dashboard-design/SKILL.md.

  ?token=...    poll /dashboard/state every 1.5 s. The token is moved out of the address bar
                (kept in sessionStorage for reloads), so it isn't on screen at the judging table.
  ?mock=1       replay tests/fixtures/dashboard_state.json with a scripted story
  ?mock=empty   tests/fixtures/dashboard_state_empty.json
  ?mock=edge    tests/fixtures/dashboard_state_edge.json (nulls, long text, every state)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c;
  --panel: #0c1015;
  --line: #1c2530;
  --fg: #c9d4df;
  --dim: #5c6b7a;
  --accent: #39ff9c;
  --amber: #ffb347;
  --ok: #39ff9c;
  --err: #ff5f6d;
  --call: #5fd4ff;
  --gap: 6px;
  --band: 12px; /* title band; the window border runs through its middle */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body {
  font: 13px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }

/* ── tiling grid ─────────────────────────────────────────────── */
#grid {
  height: 100vh;
  display: grid;
  column-gap: var(--gap);
  row-gap: 0; /* the 6px title band above each border is the vertical gap */
  padding: 0 var(--gap) var(--gap);
  grid-template-columns: minmax(0, 26fr) minmax(0, 41fr) minmax(0, 33fr);
  grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 212px 30px;
  grid-template-areas:
    "drive  jobs  log"
    "call   jobs  log"
    "next   jobs  log"
    "agents tools services"
    "sys    sys   sys";
}
#w-drive { grid-area: drive; }
#w-call { grid-area: call; }
#w-next { grid-area: next; }
#w-agents { grid-area: agents; }
#w-jobs { grid-area: jobs; }
#w-tools { grid-area: tools; }
#w-log { grid-area: log; }
#w-services { grid-area: services; }
#w-sys { grid-area: sys; }

/* ── windows ─────────────────────────────────────────────────── */
.win { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.win::before {
  content: "";
  position: absolute;
  inset: calc(var(--band) / 2) 0 0 0;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--panel);
  transition: border-color .8s ease-out;
}
.win.pulse::before { border-color: var(--accent); transition: none; }
.t {
  position: relative;
  flex: none;
  height: var(--band);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  font-size: 11px;
  line-height: var(--band);
}
.t > b {
  font-weight: 500;
  padding: 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* cut the border line: page bg above it, panel below */
  background: linear-gradient(var(--bg) 0 calc(var(--band) / 2), var(--panel) calc(var(--band) / 2));
}
.t .lbl { letter-spacing: .12em; color: var(--fg); transition: color .8s ease-out; }
.win.pulse .t .lbl { color: var(--accent); transition: none; }
.t .stat { color: var(--dim); font-weight: 400; max-width: 70%; }
.t .stat:empty { display: none; }
.body {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 6px 10px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.body::-webkit-scrollbar { width: 6px; }
.body::-webkit-scrollbar-thumb { background: var(--line); }

/* ── text atoms ──────────────────────────────────────────────── */
.dim, .k { color: var(--dim); }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.ok { color: var(--ok); }
.err { color: var(--err); }
.amb { color: var(--amber); }
.call { color: var(--call); }
.acc { color: var(--accent); }
.s-fg { color: var(--fg); }
.r { margin-left: auto; padding-left: 1ch; white-space: nowrap; }
.empty { color: var(--dim); padding: 2px 0; }
.nowrap { white-space: nowrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.line { display: flex; align-items: baseline; gap: 1ch; min-width: 0; }
.bar .fill { color: currentColor; }
.bar .rest { color: var(--dim); opacity: .45; }

/* state tags: [RUNNING] */
.tag { white-space: nowrap; }
.s-queued, .s-expired, .s-parked, .s-idle, .s-ended, .s-declined, .s-not_needed { color: var(--dim); }
.s-running, .s-needs_approval, .s-busy, .s-held, .s-pending { color: var(--amber); }
.s-done, .s-approved, .s-preapproved { color: var(--ok); }
.s-exception, .s-failed, .s-offline { color: var(--err); }
.s-on_call, .s-ringing, .s-active { color: var(--call); }
.s-plugged_in, .s-silent { color: var(--fg); }

/* motion: new rows fade in, changed rows glow once */
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } }
@keyframes glow { from { background: rgba(57, 255, 156, .07); } to { background: transparent; } }
.new { animation: fadein 150ms ease-out; }
.chg { animation: glow 1.2s ease-out; }
@keyframes blink { 50% { opacity: 0; } }
.cursor { color: var(--accent); animation: blink 1s steps(1) infinite; }

/* ── DRIVE ───────────────────────────────────────────────────── */
.kv { display: grid; grid-template-columns: 7ch 1fr; column-gap: 1ch; align-items: baseline; }
.kv > .k { line-height: 19px; }
.drive-top { display: flex; align-items: baseline; margin-bottom: 4px; }
.hero-wrap { margin-top: 8px; }
.hero {
  font-size: clamp(28px, 2.9vw, 40px);
  line-height: 1.1;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: .02em;
  font-variant-ligatures: none;
}
.hero.off { color: var(--dim); }

/* ── CALL ────────────────────────────────────────────────────── */
#b-call { display: flex; flex-direction: column; overflow: hidden; }
.tx { flex: 1; min-height: 0; overflow: hidden; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
.tx .turn { display: grid; grid-template-columns: 7ch 1fr; column-gap: 1ch; }
.tx .who-agent { color: var(--call); }
.ct { display: grid; grid-template-columns: 8ch minmax(0, 1fr) 8ch; column-gap: 1ch; }
.ct .lat { text-align: right; }

/* ── JOBS ────────────────────────────────────────────────────── */
.job { padding: 6px 0 7px; border-top: 1px dashed var(--line); }
.job:first-child { border-top: 0; padding-top: 0; }
.jh { display: flex; align-items: baseline; gap: 1ch; white-space: nowrap; }
.jid { color: var(--fg); font-weight: 700; }
.jtype { color: var(--dim); min-width: 8ch; }
.jtitle { color: var(--fg); }
.steps { display: flex; flex-wrap: wrap; column-gap: 2ch; }
.step { white-space: nowrap; }
.step .g { display: inline-block; width: 1ch; text-align: center; }
.st-pending { color: var(--dim); }
.st-done .g { color: var(--ok); }
.st-running { color: var(--amber); }
.st-failed { color: var(--err); }
.st-skipped { color: var(--dim); text-decoration: line-through; }
.step .et { color: var(--dim); }
.st-running .et { color: var(--amber); }
.sum { color: var(--fg); }
.sum::before { content: "→ "; color: var(--dim); }
.job.js-done .jtitle, .job.js-failed .jtitle, .job.js-expired .jtitle { color: var(--dim); }
/* Every job stays on screen: when JOBS overflows, d1 drops links and step details,
   d2 folds each job to two lines (header + title · approval · current step). */
.jc { display: none; }
#b-jobs.d1 .job { padding: 4px 0 5px; }
#b-jobs.d1 .link, #b-jobs.d1 .step .dim, #b-jobs.d1 .st-done .et { display: none; }
#b-jobs.d2 .jfull { display: none; }
#b-jobs.d2 .jc { display: block; }

/* ── LOG ─────────────────────────────────────────────────────── */
/* scrollback fades out under the title band instead of a half-clipped line */
#b-log { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px); mask-image: linear-gradient(to bottom, transparent 0, #000 22px); }
.ev { display: grid; grid-template-columns: 8ch 8ch 1fr; column-gap: 1ch; }
.ev .ts { color: var(--dim); }
.ev .ty { font-size: 11px; letter-spacing: .06em; line-height: 19px; }
.ty-call { color: var(--call); }
.ty-job { color: var(--amber); }
.ty-tool { color: var(--dim); }
.ty-drive { color: var(--fg); }
.ty-err { color: var(--err); }

/* ── TOOLS / SERVICES / UP NEXT rows ─────────────────────────── */
.tool { display: grid; grid-template-columns: 8ch 15ch 7ch 3ch minmax(0, 1fr); column-gap: 1ch; }
.tool .lat { text-align: right; }
.svc { display: grid; grid-template-columns: 1ch 14ch 4ch 7ch minmax(0, 1fr); column-gap: 1ch; }
.svc .lat, .svc .ago { text-align: right; }
.svc .det { grid-column: 2 / -1; color: var(--err); }
.svc .det.dim { color: var(--dim); }
.svc.stale, .svc.stale .ok, .svc.stale .err { color: var(--dim); }
.up { display: grid; grid-template-columns: 6ch minmax(0, 1fr); column-gap: 1ch; padding-bottom: 3px; }
.up-arrival_call .cd { color: var(--accent); }
.up-held_action .cd, .up-held_action .desc { color: var(--amber); }
.up-exception_call .cd, .up-exception_call .desc { color: var(--err); }

/* ── AGENTS ──────────────────────────────────────────────────── */
.tree { margin: 0; font: inherit; line-height: 1.6; white-space: pre; }
.tree .edge { color: var(--dim); }
.tree .act { color: var(--accent); }

/* ── SYSTEM strip ────────────────────────────────────────────── */
#w-sys { padding-top: var(--gap); }
#w-sys::before { inset: var(--gap) 0 0 0; }
.sys {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 2ch;
  padding: 0 10px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
}
.sys .brand { color: var(--fg); font-weight: 700; letter-spacing: .12em; }
.sys .sep { color: var(--line); }
.btn {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--fg);
  cursor: pointer;
  letter-spacing: .04em;
}
.btn:hover, .btn:focus-visible { color: var(--accent); outline: none; }
.btn:disabled { color: var(--dim); cursor: default; }

/* ── narrow screens: stack ───────────────────────────────────── */
@media (max-width: 899px) {
  body { overflow: auto; }
  #grid {
    height: auto;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: none;
    grid-auto-rows: auto;
    grid-template-areas: "drive" "call" "next" "jobs" "log" "tools" "agents" "services" "sys";
  }
  .win .body { max-height: 420px; }
  #w-log .body { height: 360px; }
  #w-sys { height: auto; }
  .sys { flex-wrap: wrap; white-space: normal; padding: 6px 10px; row-gap: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .new, .chg, .cursor { animation: none; }
  .win::before, .t .lbl { transition: none; }
}
</style>
</head>
<body>
<main id="grid">
  <section class="win" id="w-drive"><header class="t"><b class="lbl">DRIVE</b><b class="stat" id="st-drive"></b></header><div class="body" id="b-drive"><div class="empty">-- connecting --</div></div></section>
  <section class="win" id="w-call"><header class="t"><b class="lbl">CALL</b><b class="stat" id="st-call"></b></header><div class="body" id="b-call"><div class="empty">-- connecting --</div></div></section>
  <section class="win" id="w-next"><header class="t"><b class="lbl">UP NEXT</b><b class="stat" id="st-next"></b></header><div class="body" id="b-next"><div class="empty">-- connecting --</div></div></section>
  <section class="win" id="w-agents"><header class="t"><b class="lbl">AGENTS</b><b class="stat" id="st-agents"></b></header><div class="body" id="b-agents"><div class="empty">-- connecting --</div></div></section>
  <section class="win" id="w-jobs"><header class="t"><b class="lbl">JOBS</b><b class="stat" id="st-jobs"></b></header><div class="body" id="b-jobs"><div class="empty">-- connecting --</div></div></section>
  <section class="win" id="w-tools"><header class="t"><b class="lbl">TOOLS</b><b class="stat" id="st-tools"></b></header><div class="body" id="b-tools"><div class="empty">-- connecting --</div></div></section>
  <section class="win" id="w-log"><header class="t"><b class="lbl">LOG</b><b class="stat" id="st-log"></b></header><div class="body" id="b-log"><div id="log-lines"></div><div class="line"><span class="dim">$</span><span class="cursor">█</span></div></div></section>
  <section class="win" id="w-services"><header class="t"><b class="lbl">SERVICES</b><b class="stat" id="st-services"></b></header><div class="body" id="b-services"><div class="empty">-- connecting --</div></div></section>
  <footer class="win" id="w-sys"><div class="sys" id="b-sys"><span class="brand">SHOTGUN</span><span class="dim">mission control</span><span class="dim">connecting…</span></div></footer>
</main>
<script>
'use strict';

// ── config ──────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const MOCK = params.get('mock'); // "1" | "empty" | "edge" | null
const MOCK_FILES = { 1: 'dashboard_state.json', empty: 'dashboard_state_empty.json', edge: 'dashboard_state_edge.json' };
const TOKEN_KEY = 'shotgun_dashboard_token';
// Open the page as /dashboard#token=...: a #fragment never reaches the server, so the token
// stays out of Railway's access logs. ?token= still works. Requests send it as a header.
const TOKEN = (() => {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  let t = hash.get('token') || params.get('token') || '';
  try {
    if (t) sessionStorage.setItem(TOKEN_KEY, t);
    else t = sessionStorage.getItem(TOKEN_KEY) || '';
  } catch (_) { /* storage blocked: the URL token still works for this load */ }
  if (params.has('token') || hash.has('token')) {
    params.delete('token');
    const q = params.toString();
    try { history.replaceState(null, '', location.pathname + (q ? `?${q}` : '')); } catch (_) {}
  }
  return t;
})();
const AUTH = () => ({ 'X-Dashboard-Token': TOKEN });
const POLL_MS = 1500;
const STALE_MS = 90000;
const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧';
const INLINE_TOOLS = new Set(['search_web', 'draft_message', 'set_destination']);
const BUDGET = (tool) => (INLINE_TOOLS.has(tool) ? 8000 : 500);
const AGENT_ORDER = ['voice', 'orchestrator', 'coder', 'research', 'email'];
const EV = {
  plug_in: ['PLUG', 'drive'], unplug: ['UNPLUG', 'drive'], arrival_scheduled: ['SCHED', 'drive'],
  push_sent: ['PUSH', 'drive'], call_started: ['CALL', 'call'], call_ended: ['CALL', 'call'],
  arrival_call: ['ARRIVAL', 'call'], exception_call: ['EXCEPT', 'err'], tool_called: ['TOOL', 'tool'],
  job_dispatched: ['DISPATCH', 'job'], job_state: ['JOB', 'job'],
};

// ── helpers ─────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ts = (t) => {
  if (t == null || t === '') return null;
  const v = typeof t === 'number' ? t : Date.parse(t);
  return Number.isFinite(v) ? v : null;
};
const iso = (ms) => new Date(ms).toISOString().replace(/\.\d{3}Z$/, 'Z');
const pad = (n) => String(n).padStart(2, '0');
const arr = (v) => (Array.isArray(v) ? v : []);
let skew = 0; // server clock minus laptop clock; the server wins
const now = () => Date.now() + skew;
function hms(t) {
  const v = ts(t);
  if (v == null) return '--:--:--';
  const d = new Date(v);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function dur(sec) {
  if (!Number.isFinite(sec)) return '--:--';
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function ago(sec) {
  if (!Number.isFinite(sec)) return '--';
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m${pad(sec % 60)}s`;
  return `${Math.floor(sec / 3600)}h${pad(Math.floor((sec % 3600) / 60))}m`;
}
function bar(p, width) {
  const n = Math.round(Math.max(0, Math.min(1, Number.isFinite(p) ? p : 0)) * width);
  return `<span class="bar">[<span class="fill">${'█'.repeat(n)}</span><span class="rest">${'░'.repeat(width - n)}</span>]</span>`;
}
const tag = (s) => `<span class="tag s-${esc(s)}">[${esc(String(s ?? '?').replace(/_/g, ' ').toUpperCase())}]</span>`;
const sig = (v) => JSON.stringify(v);

// ── window plumbing: diff, pulse, keyed rows ────────────────────
let firstRender = true;
const prevSig = {};
function changed(key, value) {
  const s = sig(value);
  if (prevSig[key] === s) return false;
  prevSig[key] = s;
  return true;
}
function pulse(win) {
  if (firstRender) return;
  const el = $(`w-${win}`);
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  clearTimeout(el._pulse);
  el._pulse = setTimeout(() => el.classList.remove('pulse'), 700);
}
function setStat(win, html) { $(`st-${win}`).innerHTML = html; }
function flash(el, cls) {
  el.classList.remove('new', 'chg');
  void el.offsetWidth;
  el.classList.add(cls);
}

// Render `items` into `box` as rows keyed by keyFn. Unchanged rows are left alone,
// changed rows glow once, new rows fade in. Returns true if anything changed.
function keyed(box, items, keyFn, htmlFn, cls, emptyText) {
  let dirty = false;
  const old = new Map();
  for (const el of [...box.children]) {
    if (el.dataset.key == null) { el.remove(); dirty = true; } else old.set(el.dataset.key, el);
  }
  const seen = new Set();
  items.forEach((item, i) => {
    const key = String(keyFn(item));
    const html = htmlFn(item);
    const rowCls = typeof cls === 'function' ? cls(item) : cls;
    seen.add(key);
    let el = old.get(key);
    if (!el) {
      el = document.createElement('div');
      el.dataset.key = key;
      if (!firstRender) el.classList.add('new');
      dirty = true;
    } else if (el._html !== html || el._cls !== rowCls) {
      flash(el, 'chg');
      dirty = true;
    }
    if (el._html !== html) el.innerHTML = html;
    if (el._cls !== rowCls) {
      const anim = ['new', 'chg'].filter((c) => el.classList.contains(c));
      el.className = `${rowCls} ${anim.join(' ')}`.trim();
    }
    el._html = html;
    el._cls = rowCls;
    if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
  });
  for (const [key, el] of old) if (!seen.has(key)) { el.remove(); dirty = true; }
  if (!items.length && emptyText) {
    box.innerHTML = `<div class="empty">${esc(emptyText)}</div>`;
  }
  return dirty;
}

// ── DRIVE ───────────────────────────────────────────────────────
function renderDrive(s) {
  const d = s.drive;
  setStat('drive', d ? `drive #${esc(d.id)}` : '');
  // The arrival call's time: the drive's ETA - 3 min, or (no ETA) "now" once everything is
  // settled, which only the server's upcoming list knows.
  const upArrival = arr(s.upcoming).find((u) => u.kind === 'arrival_call');
  const hasJobs = arr(s.jobs).length > 0;
  if (!changed('drive', [d, upArrival ? upArrival.at : null, hasJobs])) return;
  pulse('drive');
  const b = $('b-drive');
  if (!d) {
    b.innerHTML = '<div class="empty">-- no drive: waiting for CarPlay --</div>';
    return;
  }
  const start = ts(d.started_at), eta = ts(d.eta);
  const arrAt = ts(d.arrival_call_at) ?? (upArrival ? ts(upArrival.at) : null);
  let hero;
  if (d.ended_at) {
    hero = `<div class="k">PARKED</div><div class="hero off">${hms(d.ended_at)}</div>
      <div class="dim">drive lasted ${dur((ts(d.ended_at) - start) / 1000)}</div>`;
  } else if (d.arrival_called) {
    hero = `<div class="k">ARRIVAL CALL</div><div class="hero">PLACED</div>
      <div class="dim">batched summary${arrAt ? ` due ${hms(arrAt)}` : ''}; nothing rings after it</div>`;
  } else if (arrAt) {
    const trip = eta && start ? `<div class="nowrap" data-trip="${start},${eta}"></div>` : '';
    const note = !hasJobs ? '<div class="dim">no jobs yet: it rings only with something to report</div>'
      : !eta ? '<div class="dim">no ETA: rings once every job is done or held</div>' : '';
    hero = `<div class="k">ARRIVAL CALL IN</div><div class="hero ${hasJobs ? '' : 'off'}" data-cd="${arrAt}"></div>${trip}${note}`;
  } else {
    const why = !d.destination ? 'waiting for a destination'
      : !hasJobs ? 'no jobs yet: no arrival call'
      : 'no ETA: rings once every job is done or held';
    hero = `<div class="k">ARRIVAL CALL</div><div class="hero off">--:--</div>
      <div class="dim">-- ${why} --</div>`;
  }
  b.innerHTML = `

// ── LOG ─────────────────────────────────────────────────────────

    .filter((e) => e && typeof e === 'object')
    .map((e) => ({ ...e, id: Number.isFinite(e.id) ? e.id : `${e.at}|${e.type}|${e.message}` }));

// ── tickers: countdowns, elapsed, ages, spinners ────────────────
function tick() {
  const t = now();

    const left = (+el.dataset.cd - t) / 1000;

  }
  for (const el of document.querySelectorAll('[data-since]')) {

    el.textContent = dur((end - +el.dataset.since) / 1000);
  }
  for (const el of document.querySelectorAll('[data-ago]')) {
    const txt = ago((t - +el.dataset.ago) / 1000);
    el.textContent = el.dataset.pad ? txt.padStart(+el.dataset.pad) : txt;
  }
  for (const el of document.querySelectorAll('[data-checked]')) {

  }
  for (const el of document.querySelectorAll('[data-trip]')) {
    const [a, b] = el.dataset.trip.split(',').map(Number);
    const p = b > a ? (t - a) / (b - a) : 0;
    el.innerHTML = `${bar(p, 20)} <span class="dim">${Math.round(Math.max(0, Math.min(1, p)) * 100)}% of trip</span>`;
  }
  for (const el of document.querySelectorAll('[data-up]')) {
    const [up, at] = el.dataset.up.split(',').map(Number);

}

  tick();
  const ch = SPIN[spinFrame % SPIN.length];
  for (const el of document.querySelectorAll('.spin')) el.textContent = ch;
}

// ── data source: live polling ───────────────────────────────────
async function fetchState() {
  if (!TOKEN) throw new Error('no #token= in URL');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch('/dashboard/state', { cache: 'no-store', signal: ctl.signal, headers: AUTH() });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (err) {
    throw new Error(err.name === 'AbortError' ? 'timeout' : err.message);
  } finally {
    clearTimeout(timer);
  }
}

// ── data source: mock replay ────────────────────────────────────
// Loads a fixture (real /dashboard/state output, regenerated by tests/test_dashboard_fixtures.py),
// then plays a scripted story on top of it in the backend's own formats: the coder job's tests
// pass, the pre-approval holds and the PR merges with no call; a research job is dispatched and
// answered; an inline search; the driver says goodbye. Times are fixture time + real elapsed
// time, so countdowns tick. Loops after MOCK_LOOP_S.
const MOCK_LOOP_S = 45;
let fixture = null, mock = null, mockT0 = 0, mockStep = 0;
function mockReset() {
  mock = structuredClone(fixture);
  mockT0 = Date.now();
  mockStep = 0;
}
const J = (s, id) => s.jobs.find((j) => j.id === id);
const S = (j, name) => j.steps.find((x) => x.name === name);
const A = (s, name) => s.agents.find((a) => a.name === name);
function ev(s, t, type, message, jobId = null) {
  const id = s.events.reduce((m, e) => Math.max(m, e.id), 0) + 1;
  s.events.push({ id, at: iso(t), type, message, job_id: jobId });
  while (s.events.length > 100) s.events.shift();
}
function useTool(s, t, tool, query, latency) {
  s.tool_calls.unshift({ at: iso(t - latency), tool, query, latency_ms: latency, ok: true });
  s.tool_calls.length = Math.min(s.tool_calls.length, 20);
  if (s.call) s.call.last_tool = tool;
  ev(s, t - latency, 'tool_called', `${tool}${query ? ` "${query}"` : ''} ${latency}ms`);
}
function step(j, name, st, t, detail) {
  const x = S(j, name);
  x.state = st;
  if (st === 'running') x.started_at = iso(t);
  if (st === 'done' || st === 'failed') { x.finished_at = iso(t); x.started_at = x.started_at || iso(t); }
  if (detail !== undefined) x.detail = detail;
  j.progress = Math.round((j.steps.filter((y) => y.state === 'done' || y.state === 'skipped').length / j.steps.length) * 100) / 100;
}
const dropUpcoming = (s, kind, jobId) => { s.upcoming = s.upcoming.filter((u) => !(u.kind === kind && u.job_id === jobId)); };
const arrival = (s, n) => { const a = s.upcoming.find((u) => u.kind === 'arrival_call'); if (a) a.description = `arrival call: batched summary of ${n} jobs`; };

const MOCK_SCRIPT = [
  [3, (s, t) => { // check_run "tests" completed: success -> approvals.settle -> approved
    const j = J(s, 42);
    step(j, 'tests', 'done', t, 'passed');
    step(j, 'approval_check', 'done', t, 'pre-approved');
    step(j, 'merged', 'running', t);
    j.state = 'approved';
    j.updated_at = iso(t);
    dropUpcoming(s, 'job_expiry', 42);
    const pre = s.upcoming.find((u) => u.kind === 'preapproved_action' && u.job_id === 42);
    if (pre) Object.assign(pre, { at: iso(t), description: 'merge the PR: approved, going through' });
    s.active_agent = 'coder';
    ev(s, t, 'job_state', '#42 running → approved: pre-approved: merge it if the tests pass', 42);
  }],
  [8, (s, t) => { // coder.merge_approved
    const j = J(s, 42);
    step(j, 'merged', 'done', t);
    j.state = 'done';
    j.updated_at = iso(t);
    j.result_summary = 'Merged: Fix the login redirect loop on /settings. The tests passed.';
    Object.assign(A(s, 'coder'), { status: 'idle', current_job_id: null });
    dropUpcoming(s, 'preapproved_action', 42);
    ev(s, t, 'job_state', '#42 approved → done: merged', 42);
  }],
  [12, (s, t) => {
    useTool(s, t, 'dispatch_task', 'research: gas station on the way to North Campus', 176);
    s.jobs.push({
      id: 43, type: 'research', title: 'Gas on the way to North Campus',
      details: { conversation_id: 'conv_17', label: 'Gas on the way to North Campus' }, state: 'queued', progress: 0,
      steps: ['searching', 'summarizing'].map((name) => ({ name, state: 'pending', started_at: null, finished_at: null, detail: null })),
      preapproval: null, approval: { status: 'not_needed', note: null },
      result_summary: null, result_url: null, created_at: iso(t), updated_at: iso(t),
    });
    arrival(s, 3);
    s.active_agent = 'voice';
    ev(s, t, 'job_dispatched', 'research #43: Gas on the way to North Campus', 43);
  }],
  [13, (s, t) => {
    const j = J(s, 43);
    j.state = 'running';
    j.updated_at = iso(t);
    step(j, 'searching', 'running', t);
    Object.assign(A(s, 'research'), { status: 'busy', current_job_id: 43 });
    s.active_agent = 'research';
    ev(s, t, 'job_state', '#43 queued → running: claimed', 43);
  }],
  [19, (s, t) => {
    const j = J(s, 43);
    step(j, 'searching', 'done', t);
    step(j, 'summarizing', 'done', t);
    j.state = 'done';
    j.updated_at = iso(t);
    j.result_summary = "There's a Shell on Plymouth Road, right on your way.";
    Object.assign(A(s, 'research'), { status: 'idle', current_job_id: null });
    s.active_agent = 'voice';
    ev(s, t, 'job_state', '#43 running → done', 43);
  }],
  [24, (s, t) => useTool(s, t, 'search_web', 'coffee open now near North Campus', 2891)],
  [30, (s, t) => { // the driver says goodbye; the monitor sees the conversation end
    s.call.status = 'ended';
    s.drive.status = 'silent';
    Object.assign(A(s, 'voice'), { status: 'idle', current_job_id: null });
    s.active_agent = null;
    ev(s, t, 'call_ended', `call ended after ${dur(s.call.duration_s)}`);
  }],
];

function mockDemo(action) {
  const t = ts(mock.server.now);
  const id = mock.drive ? mock.drive.id : '?';
  const msg = {
    'plug-in': ['plug_in', `simulated plug-in (demo): drive #${id} opened`],
    arrive: ['arrival_scheduled', `simulated arrival (demo): drive #${id} calls on the next tick`],
    unplug: ['unplug', 'simulated unplug (demo)'],
  }[action];
  if (msg) ev(mock, t, msg[0], msg[1]);
}

async function mockNext() {
  if (!fixture) {
    const r = await fetch(`../tests/fixtures/${MOCK_FILES[MOCK] || MOCK_FILES[1]}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`fixture HTTP ${r.status}`);
    fixture = await r.json();
    mockReset();
  }
  const script = MOCK === '1' ? MOCK_SCRIPT : [];
  let el = (Date.now() - mockT0) / 1000;
  if (script.length && el > MOCK_LOOP_S) { mockReset(); el = 0; }
  const base = ts(fixture.server && fixture.server.now) ?? Date.now();
  const t = base + el * 1000;
  if (!mock.server) mock.server = {};
  mock.server.now = iso(t);
  mock.server.uptime_s = (fixture.server && fixture.server.uptime_s || 0) + Math.floor(el);
  if (mock.call && mock.call.status === 'active') mock.call.duration_s = (fixture.call.duration_s || 0) + Math.floor(el);
  for (const a of arr(mock.agents)) {
    if (a && a.name !== 'voice' && a.status !== 'offline') a.last_heartbeat = iso(t);
  }
  arr(fixture.services).forEach((fs, i) => {
    const age = base - ts(fs && fs.checked_at);
    if (fs && fs.checked_at && age < STALE_MS && fs.name !== 'api_server') {
      mock.services[i].checked_at = iso(ts(fs.checked_at) + Math.floor((el + age / 1000) / 30) * 30000);
    } else if (fs && fs.name === 'api_server') {
      mock.services[i].checked_at = iso(t);
    }
  });
  while (mockStep < script.length && script[mockStep][0] <= el) script[mockStep++][1](mock, t);
  return structuredClone(mock);
}


// ── main loop ───────────────────────────────────────────────────
async function poll() {
  try {
    apply(MOCK ? await mockNext() : await fetchState());
  } catch (err) {
    offline = true;
    lastError = err.message;
    renderSystem(state);
  }
  setTimeout(poll, POLL_MS);
}
renderSystem(null);
poll();
</script>
