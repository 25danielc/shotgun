[project]
name = "shotgun"
version = "0.1.0"
description = "An AI agent saved as a phone contact: it rings your car when you plug in."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=1.11",  # fallbacks="default" + httpx2 transport
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Stretch: step 6.1. Install with `uv sync --extra fetch`.
fetch = ["uagents"]  # TODO(verify): pin uagents / uagents-core versions from PyPI when building 6.1

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real third-party APIs or phones; skipped unless RUN_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude/worktrees"]  # subagent worktrees are separate checkouts

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S603", "S607"]  # scripts shell out to git with fixed args
